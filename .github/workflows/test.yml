---
on:
  pull_request:
    branches: [ master ]

jobs:
  test-formula:
    runs-on: 	macos-latest
    strategy:
      fail-fast: false
      matrix:
        formulae:
          [
            bbl,
            bbr,
            cf-cli,
            cf-cli@7,
            cf-cli@8,
            credhub-cli,
            uaa-cli,
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: homebrew-tap
      - name: Install formula
        run: |
          brew tap cloudfoundry/tap
          cp -r homebrew-tap/. $(brew --repository cloudfoundry/tap)/
          brew trust cloudfoundry/tap
          brew install --formula cloudfoundry/tap/${{ matrix.formulae }}

  test-cask:
    runs-on: 	macos-latest
    strategy:
      fail-fast: false
      matrix:
        cask:
          [
            uaa-cli
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: homebrew-tap
      - name: Install cask
        run: |
          brew tap cloudfoundry/tap
          cp -r homebrew-tap/. $(brew --repository cloudfoundry/tap)/
          brew trust cloudfoundry/tap
          brew install --cask cloudfoundry/tap/${{ matrix.cask }}
